name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/REVERSE-ENGINEERING.md"
      - "docs/images/banner.webp"
      - "Scripts/make-site.py"
      - "Scripts/site-requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap's lastmod comes from each page's last commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/site-requirements.txt

      - run: pip install -r Scripts/site-requirements.txt

      - run: python Scripts/make-site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
