name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Build
        run: swift build --build-tests

      # The test frameworks ship with Xcode, not with the Command Line Tools,
      # so tests run under whichever Xcode the runner provides.
      - name: Test
        run: swift test

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

      - name: Build the app bundle
        run: ./Scripts/build-app.sh

      - name: Verify the bundle
        run: |
          test -x build/SpaceSwitch.app/Contents/MacOS/SpaceSwitch
          test -x build/SpaceSwitch.app/Contents/Helpers/spaceswitch
          codesign --verify --deep --strict build/SpaceSwitch.app
          ./build/SpaceSwitch.app/Contents/Helpers/spaceswitch presets --refresh 120
